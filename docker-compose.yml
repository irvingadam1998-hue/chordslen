services:
  extractor:
    build:
      context: .
      dockerfile: backend/extractor_server/Dockerfile
    restart: unless-stopped
    ports:
      - '5002:5002'
    environment:
      PORT: '5002'
      API_KEY: '${API_KEY:-local-development-key}'
      MAX_CONCURRENT_JOBS: '1'
      JOB_TTL_SECONDS: '3600'
      YOUTUBE_MIN_INTERVAL_SECONDS: '5'
      YOUTUBE_COOLDOWN_SECONDS: '900'
      EXTRACTOR_TMP_DIR: /data
    volumes:
      - worker-data:/data

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - '3000:3000'
    environment:
      NODE_ENV: production
      FLASK_API_URL: http://extractor:5002
      FLASK_API_KEY: '${API_KEY:-local-development-key}'
      PUBLIC_WORKER_URL: '${PUBLIC_WORKER_URL:-http://localhost:5002}'
    depends_on:
      - extractor

volumes:
  worker-data:
