services:
  - type: web
    name: chordlens-worker
    runtime: docker
    region: oregon
    dockerfilePath: ./backend/extractor_server/Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: '5002'
      - key: API_KEY
        generateValue: true
      - key: MAX_CONCURRENT_JOBS
        value: '1'
      - key: JOB_TTL_SECONDS
        value: '3600'
      - key: EXTRACTOR_FILE_TTL_SECONDS
        value: '900'
      - key: YOUTUBE_MIN_INTERVAL_SECONDS
        value: '5'
      - key: YOUTUBE_COOLDOWN_SECONDS
        value: '900'
      - key: MAX_UPLOAD_MB
        value: '50'
      - key: ACR_ENGINE
        value: neural
      - key: ACR_MODE
        value: accurate
      - key: ACR_VOCABULARY
        value: triads
      - key: ACR_MODEL_PATH
        value: /app/checkpoints/candidate.pt
